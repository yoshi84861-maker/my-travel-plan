<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>菇點紀錄</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft JhengHei",
        sans-serif;

    background: #f4f6f8;
    color: #333;
}

.container {
    max-width: 1000px;
    margin: auto;
    padding: 25px;
}

h1 {
    text-align: center;
    margin-bottom: 25px;
}


/* 新增區域 */

.form-box {

    background: white;

    padding: 20px;

    border-radius: 12px;

    box-shadow:
        0 3px 10px rgba(0,0,0,0.08);

    display: grid;

    grid-template-columns:
        1fr
        1fr
        1fr
        1fr;

    gap: 12px;

    margin-bottom: 20px;

}

input,
select,
button {

    padding: 12px;

    border-radius: 8px;

    border: 1px solid #ccc;

    font-size: 15px;

}

button {

    cursor: pointer;

    border: none;

}


/* 新增按鈕 */

.add-btn {

    background: #4CAF50;

    color: white;

}

.add-btn:hover {

    background: #3d9141;

}


/* 篩選區 */

.filter-box {

    display: flex;

    gap: 10px;

    align-items: center;

    margin-bottom: 15px;

}


/* 表格 */

.table-box {

    background: white;

    border-radius: 12px;

    overflow: hidden;

    box-shadow:
        0 3px 10px rgba(0,0,0,0.08);

}

table {

    width: 100%;

    border-collapse: collapse;

}

th {

    background: #333;

    color: white;

}

th,
td {

    padding: 14px;

    text-align: center;

    border-bottom:
        1px solid #eee;

}

tr:hover {

    background: #fafafa;

}


/* 按鈕 */

.edit-btn {

    background: #2196F3;

    color: white;

    margin-right: 5px;

}

.delete-btn {

    background: #f44336;

    color: white;

}

.edit-btn:hover {

    background: #1976D2;

}

.delete-btn:hover {

    background: #d32f2f;

}


/* 手機 */

@media (max-width: 700px) {

    .form-box {

        grid-template-columns: 1fr;

    }

    table {

        font-size: 13px;

    }

    th,
    td {

        padding: 8px;

    }

}

</style>

</head>


<body>

<div class="container">

<h1>🍄 菇點紀錄</h1>


<!-- 新增紀錄 -->

<div class="form-box">

<input
id="coordinate"
placeholder="座標，例如 123,456"
/>


<select id="type">

<option value="">選擇菇點類型</option>

<option>毒</option>
<option>電</option>
<option>水</option>
<option>水晶</option>
<option>火</option>
<option>巨大活動</option>
<option>一般活動免費</option>
<option>大毒</option>
<option>大電</option>
<option>大水晶</option>
<option>大火</option>

</select>


<select id="people">

<option value="">剩餘人數</option>

<option>5</option>
<option>4</option>
<option>3</option>
<option>2</option>
<option>1</option>

</select>


<input
type="datetime-local"
id="time"
/>


<button
class="add-btn"
onclick="addRecord()">

➕ 新增紀錄

</button>

</div>



<!-- 篩選 -->

<div class="filter-box">

<label>

📊 菇點類型：

</label>


<select
id="filterType"
onchange="renderRecords()">

<option value="全部">

全部

</option>

<option>毒</option>
<option>電</option>
<option>水</option>
<option>水晶</option>
<option>火</option>
<option>巨大活動</option>
<option>一般活動免費</option>
<option>大毒</option>
<option>大電</option>
<option>大水晶</option>
<option>大火</option>

</select>

</div>



<!-- 表格 -->

<div class="table-box">

<table>

<thead>

<tr>

<th>坐標</th>

<th>菇點類型</th>

<th>剩餘人數</th>

<th>時間</th>

<th>操作</th>

</tr>

</thead>


<tbody id="recordList">

</tbody>

</table>

</div>


</div>



<!-- Firebase -->

<script type="module">


import {
initializeApp
}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {

getFirestore,

collection,

addDoc,

deleteDoc,

doc,

updateDoc,

onSnapshot,

query,

orderBy

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



/* =========================

Firebase 設定

請替換成你的 Firebase 資料

========================= */


const firebaseConfig = {

apiKey:
"你的API_KEY",

authDomain:
"你的PROJECT.firebaseapp.com",

projectId:
"你的PROJECT_ID",

storageBucket:
"你的PROJECT.appspot.com",

messagingSenderId:
"你的ID",

appId:
"你的APP_ID"

};



const app =
initializeApp(firebaseConfig);


const db =
getFirestore(app);



/* =========================

資料

========================= */


let records = [];

let editingId = null;



const recordCollection =
collection(db, "mushroomRecords");



/* =========================

即時同步資料

========================= */


const q =
query(
recordCollection,
orderBy("createdAt", "desc")
);



onSnapshot(q, (snapshot) => {


records = [];


snapshot.forEach((document) => {


records.push({

id: document.id,

...document.data()

});


});


renderRecords();


});



/* =========================

新增

========================= */


window.addRecord =
async function() {


const coordinate =
document
.getElementById("coordinate")
.value
.trim();


const type =
document
.getElementById("type")
.value;


const people =
document
.getElementById("people")
.value;


const time =
document
.getElementById("time")
.value;



if (!coordinate) {

alert("請輸入座標");

return;

}


if (!type) {

alert("請選擇菇點類型");

return;

}


if (!people) {

alert("請選擇剩餘人數");

return;

}


if (!time) {

alert("請選擇時間");

return;

}



/* 修改模式 */


if (editingId) {


await updateDoc(

doc(
db,
"mushroomRecords",
editingId
),

{

coordinate,

type,

people,

time

}

);



editingId = null;


document
.querySelector(".add-btn")
.innerText =
"➕ 新增紀錄";


}


/* 新增模式 */


else {


await addDoc(

recordCollection,

{

coordinate,

type,

people,

time,

createdAt:
Date.now()

}

);


}



/* 清空 */


document
.getElementById("coordinate")
.value =
"";


document
.getElementById("type")
.value =
"";


document
.getElementById("people")
.value =
"";


document
.getElementById("time")
.value =
"";


};



/* =========================

顯示資料

========================= */


window.renderRecords =
function() {


const filter =
document
.getElementById("filterType")
.value;


const list =
document
.getElementById("recordList");


list.innerHTML =
"";



let filteredRecords =
records;



if (filter !== "全部") {


filteredRecords =
records.filter(


record =>

record.type === filter


);


}



/* 建立表格 */


filteredRecords.forEach(


record => {


const row =
document.createElement("tr");



row.innerHTML = `


<td>

${record.coordinate}

</td>


<td>

${record.type}

</td>


<td>

${record.people}

</td>


<td>

${formatTime(record.time)}

</td>


<td>


<button

class="edit-btn"

onclick="editRecord('${record.id}')"

>

✏️ 修改

</button>



<button

class="delete-btn"

onclick="deleteRecord('${record.id}')"

>

🗑️ 刪除

</button>


</td>


`;



list.appendChild(row);


}


);


};



/* =========================

時間格式

========================= */


function formatTime(time) {


if (!time) {

return "";

}


const date =
new Date(time);



return date.toLocaleString(

"zh-TW",

{

year: "numeric",

month: "2-digit",

day: "2-digit",

hour: "2-digit",

minute: "2-digit"

}

);


}



/* =========================

修改

========================= */


window.editRecord =
function(id) {


const record =
records.find(


r => r.id === id


);



if (!record) return;



document
.getElementById("coordinate")
.value =
record.coordinate;


document
.getElementById("type")
.value =
record.type;


document
.getElementById("people")
.value =
record.people;


document
.getElementById("time")
.value =
record.time;



editingId =
id;



document
.querySelector(".add-btn")
.innerText =
"💾 儲存修改";



window.scrollTo({

top: 0,

behavior: "smooth"

});


};



/* =========================

刪除

========================= */


window.deleteRecord =
async function(id) {


const confirmDelete =
confirm(

"確定要刪除這筆紀錄嗎？"

);



if (!confirmDelete) {

return;

}



await deleteDoc(

doc(
db,
"mushroomRecords",
id
)

);


};



</script>


</body>

</html>
