```html
<!DOCTYPE html>

<body>

<div class="container">

  <h1>🍄 菇點紀錄</h1>


  <!-- 新增 / 修改 -->

  <div class="card">

    <div class="form-grid">


      <div>
        <label>📍 座標</label>

        <input
          type="text"
          id="coordinate"
          placeholder="例如：42.6957080, 23.3320190"
        >
      </div>


      <div>
        <label>📌 地點（非必填）</label>

        <input
          type="text"
          id="location"
          placeholder="例如：Sofia"
        >
      </div>


      <div>
        <label>🍄 菇點類型</label>

        <select id="type">
          <option value="毒">毒</option>
          <option value="電">電</option>
          <option value="水">水</option>
          <option value="水晶">水晶</option>
          <option value="火">火</option>
          <option value="巨大活動">巨大活動</option>
          <option value="一般活動免費">一般活動免費</option>
          <option value="大毒">大毒</option>
          <option value="大電">大電</option>
          <option value="大水晶">大水晶</option>
          <option value="大火">大火</option>
        </select>
      </div>


      <div>
        <label>👥 剩餘人數</label>

        <select id="people">
          <option value="5">5</option>
          <option value="4">4</option>
          <option value="3">3</option>
          <option value="2">2</option>
          <option value="1">1</option>
        </select>
      </div>


      <div>
        <label>🕐 當地時間</label>

        <input
          type="text"
          id="localTime"
          placeholder="輸入座標後自動取得"
          readonly
        >
      </div>


      <div>
        <label>⏳ 剩餘時間（非必填）</label>

        <input
          type="text"
          id="remainingTime"

        >
      </div>


    </div>


    <div class="button-row">

      <button
        class="btn-add"
        id="saveBtn"
        onclick="saveRecord()"
      >
        ➕ 新增紀錄
      </button>


      <button
        class="btn-cancel"
        id="cancelBtn"
        onclick="cancelEdit()"
        style="display:none;"
      >
        取消修改
      </button>

    </div>


    <div
      class="status"
      id="status"
    ></div>

  </div>



  <!-- 篩選 -->

  <div class="card">

    <label>📊 依菇點類型篩選</label>

    <select
      id="filterType"
      class="filter"
      onchange="renderRecords()"
    >

      <option value="全部">全部</option>

      <option value="毒">毒</option>
      <option value="電">電</option>
      <option value="水">水</option>
      <option value="水晶">水晶</option>
      <option value="火">火</option>

      <option value="巨大活動">巨大活動</option>
      <option value="一般活動免費">
        一般活動免費
      </option>

      <option value="大毒">大毒</option>
      <option value="大電">大電</option>
      <option value="大水晶">大水晶</option>
      <option value="大火">大火</option>

    </select>

  </div>



  <!-- 紀錄表格 -->

  <div class="card">

    <div class="table-wrapper">

      <table>

        <thead>

          <tr>

            <th>座標</th>

            <th>地點</th>

            <th>菇點類型</th>

            <th>剩餘人數</th>

            <th>當地時間</th>

            <th>剩餘時間</th>

            <th>操作</th>

          </tr>

        </thead>


        <tbody id="recordList"></tbody>

      </table>

    </div>

  </div>

</div>



<script type="module">


  import {
    initializeApp
  }
  from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


  import {

    getFirestore,

    collection,

    addDoc,

    deleteDoc,

    updateDoc,

    doc,

    onSnapshot,

    query,

    orderBy,

    serverTimestamp,

    Timestamp

  }
  from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



  // ==========================================================
  // Firebase 設定
  // ==========================================================


  const firebaseConfig = {

    apiKey: "你的_API_KEY",

    authDomain: "你的_PROJECT_ID.firebaseapp.com",

    projectId: "你的_PROJECT_ID",

    storageBucket: "你的_PROJECT_ID.appspot.com",

    messagingSenderId:
      "你的_MESSAGING_SENDER_ID",

    appId: "你的_APP_ID"

  };



  const app =
    initializeApp(firebaseConfig);



  const db =
    getFirestore(app);



  const recordsRef =
    collection(
      db,
      "mushroomRecords"
    );



  // ==========================================================
  // 全域變數
  // ==========================================================


  let records = [];


  let editingId = null;



  // ==========================================================
  // 座標解析
  // ==========================================================


  function parseCoordinate(text) {


    const parts =
      text
        .split(",")
        .map(
          x => x.trim()
        );



    if (
      parts.length !== 2
    ) {

      return null;

    }



    const lat =
      Number(parts[0]);


    const lng =
      Number(parts[1]);



    if (

      Number.isNaN(lat) ||

      Number.isNaN(lng) ||

      lat < -90 ||

      lat > 90 ||

      lng < -180 ||

      lng > 180

    ) {

      return null;

    }



    return {

      lat,

      lng

    };


  }



  // ==========================================================
  // 時區判斷
  // ==========================================================


  function getTimezone(
    lat,
    lng
  ) {


    // 台灣

    if (

      lat >= 21 &&

      lat <= 26 &&

      lng >= 119 &&

      lng <= 123

    ) {

      return "Asia/Taipei";

    }



    // 日本

    if (

      lat >= 24 &&

      lat <= 46 &&

      lng >= 123 &&

      lng <= 146

    ) {

      return "Asia/Tokyo";

    }



    // 韓國

    if (

      lat >= 33 &&

      lat <= 39 &&

      lng >= 124 &&

      lng <= 130

    ) {

      return "Asia/Seoul";

    }



    // 英國

    if (

      lat >= 49 &&

      lat <= 59 &&

      lng >= -9 &&

      lng <= 2

    ) {

      return "Europe/London";

    }



    // 保加利亞

    if (

      lat >= 41 &&

      lat <= 44 &&

      lng >= 22 &&

      lng <= 29

    ) {

      return "Europe/Sofia";

    }



    // 美國東部

    if (

      lat >= 24 &&

      lat <= 50 &&

      lng >= -85 &&

      lng <= -65

    ) {

      return "America/New_York";

    }



    // 美國西部

    if (

      lat >= 30 &&

      lat <= 50 &&

      lng >= -125 &&

      lng <= -100

    ) {

      return "America/Los_Angeles";

    }



    // 中歐

    if (

      lat >= 42 &&

      lat <= 55 &&

      lng >= 5 &&

      lng <= 20

    ) {

      return "Europe/Berlin";

    }



    return "UTC";


  }



  // ==========================================================
  // 取得當地時間
  // ==========================================================


  function getLocalTime(
    coordinate
  ) {


    const point =
      parseCoordinate(
        coordinate
      );



    if (!point) {

      return "";

    }



    const timezone =
      getTimezone(
        point.lat,
        point.lng
      );



    return new Intl.DateTimeFormat(

      "zh-TW",

      {

        timeZone: timezone,

        year: "numeric",

        month: "2-digit",

        day: "2-digit",

        hour: "2-digit",

        minute: "2-digit",

        second: "2-digit",

        hour12: false

      }

    ).format(

      new Date()

    );


  }



  // ==========================================================
  // 座標輸入時更新當地時間
  // ==========================================================


  document
    .getElementById("coordinate")
    .addEventListener(

      "input",

      function() {


        document
          .getElementById("localTime")
          .value =

          getLocalTime(
            this.value.trim()
          );


      }

    );



  // ==========================================================
  // 剩餘時間 mm:ss → 秒
  // ==========================================================


  function parseDuration(
    text
  ) {


    text =
      text.trim();



    if (!text) {

      return null;

    }



    const parts =
      text.split(":");



    if (
      parts.length !== 2
    ) {

      return "INVALID";

    }



    const minutes =
      Number(parts[0]);


    const seconds =
      Number(parts[1]);



    if (

      Number.isNaN(minutes) ||

      Number.isNaN(seconds) ||

      minutes < 0 ||

      seconds < 0 ||

      seconds >= 60

    ) {

      return "INVALID";

    }



    return (
      minutes * 60 +
      seconds
    );


  }



  // ==========================================================
  // 秒 → mm:ss
  // ==========================================================


  function formatTime(
    totalSeconds
  ) {


    totalSeconds =
      Math.max(
        0,
        Math.floor(
          totalSeconds
        )
      );



    const minutes =
      Math.floor(
        totalSeconds / 60
      );


    const seconds =
      totalSeconds % 60;



    return (

      String(minutes)
        .padStart(2, "0")

      +

      ":"

      +

      String(seconds)
        .padStart(2, "0")

    );


  }



  // ==========================================================
  // 新增 / 修改
  // ==========================================================


  window.saveRecord =
    async function() {


      const coordinate =
        document
          .getElementById("coordinate")
          .value
          .trim();



      const location =
        document
          .getElementById("location")
          .value
          .trim();



      const type =
        document
          .getElementById("type")
          .value;



      const people =
        Number(

          document
            .getElementById("people")
            .value

        );



      const remainingTime =
        document
          .getElementById("remainingTime")
          .value
          .trim();



      // 檢查座標


      const point =
        parseCoordinate(
          coordinate
        );



      if (!point) {

        alert(

          "座標格式錯誤！\n\n" +

          "請輸入例如：\n" +

          "42.6957080, 23.3320190"

        );


        return;

      }



      // 剩餘時間


      const duration =
        parseDuration(
          remainingTime
        );



      if (
        duration === "INVALID"
      ) {

        alert(

          "剩餘時間格式錯誤！\n\n" +

          "請輸入例如：30:00\n\n" +

          "或留空。"

        );


        return;

      }



      let endAt =
        null;



      // 有填剩餘時間才建立倒數


      if (
        duration !== null
      ) {


        if (
          duration <= 0
        ) {

          alert(
            "剩餘時間必須大於 0。"
          );

          return;

        }



        endAt =
          Timestamp.fromMillis(

            Date.now() +

            duration * 1000

          );


      }



      try {


        // 修改


        if (
          editingId
        ) {


          await updateDoc(

            doc(

              db,

              "mushroomRecords",

              editingId

            ),

            {

              coordinate,

              location,

              type,

              people,

              endAt,

              updatedAt:
                serverTimestamp()

            }

          );


          showStatus(
            "✅ 修改成功"
          );


        }


        // 新增


        else {


          await addDoc(

            recordsRef,

            {

              coordinate,

              location,

              type,

              people,

              endAt,

              createdAt:
                serverTimestamp()

            }

          );


          showStatus(
            "✅ 新增成功"
          );


        }



        resetForm();


      }


      catch (
        error
      ) {


        console.error(
          error
        );


        alert(

          "儲存失敗：\n" +

          error.message

        );


      }


    };



  // ==========================================================
  // 刪除
  // ==========================================================


  window.deleteRecord =
    async function(
      id
    ) {


      if (

        !confirm(
          "確定要刪除這筆紀錄嗎？"
        )

      ) {

        return;

      }



      try {


        await deleteDoc(

          doc(

            db,

            "mushroomRecords",

            id

          )

        );


      }


      catch (
        error
      ) {


        alert(

          "刪除失敗：\n" +

          error.message

        );


      }


    };



  // ==========================================================
  // 修改
  // ==========================================================


  window.editRecord =
    function(
      id
    ) {


      const record =
        records.find(

          r => r.id === id

        );



      if (
        !record
      ) {

        return;

      }



      editingId =
        id;



      document
        .getElementById("coordinate")
        .value =

        record.coordinate || "";



      document
        .getElementById("location")
        .value =

        record.location || "";



      document
        .getElementById("type")
        .value =

        record.type;



      document
        .getElementById("people")
        .value =

        record.people;



      document
        .getElementById("localTime")
        .value =

        getLocalTime(
          record.coordinate
        );



      // 有倒數時間才顯示


      if (
        record.endAt
      ) {


        const remaining =

          Math.max(

            0,

            Math.floor(

              (

                record.endAt.toMillis() -

                Date.now()

              )

              / 1000

            )

          );



        document
          .getElementById("remainingTime")
          .value =

          formatTime(
            remaining
          );


      }


      else {


        document
          .getElementById("remainingTime")
          .value = "";


      }



      document
        .getElementById("saveBtn")
        .textContent =

        "💾 儲存修改";



      document
        .getElementById("saveBtn")
        .className =

        "btn-edit";



      document
        .getElementById("cancelBtn")
        .style
        .display =

        "block";



      window.scrollTo({

        top: 0,

        behavior: "smooth"

      });


    };



  // ==========================================================
  // 取消修改
  // ==========================================================


  window.cancelEdit =
    function() {


      resetForm();


    };



  function resetForm() {


    editingId =
      null;



    document
      .getElementById("coordinate")
      .value = "";



    document
      .getElementById("location")
      .value = "";



    document
      .getElementById("type")
      .value = "毒";



    document
      .getElementById("people")
      .value = "5";



    document
      .getElementById("localTime")
      .value = "";



    document
      .getElementById("remainingTime")
      .value = "";



    document
      .getElementById("saveBtn")
      .textContent =

      "➕ 新增紀錄";



    document
      .getElementById("saveBtn")
      .className =

      "btn-add";



    document
      .getElementById("cancelBtn")
      .style
      .display =

      "none";


  }



  // ==========================================================
  // 複製座標
  // ==========================================================


  window.copyCoordinate =
    async function(
      coordinate
    ) {


      try {


        await navigator.clipboard.writeText(
          coordinate
        );


        showStatus(

          "📋 已複製座標：" +

          coordinate

        );


      }


      catch (
        error
      ) {


        // 舊版瀏覽器備用


        const textarea =
          document.createElement(
            "textarea"
          );


        textarea.value =
          coordinate;



        document.body.appendChild(
          textarea
        );


        textarea.select();



        document.execCommand(
          "copy"
        );


        textarea.remove();



        showStatus(
          "📋 已複製座標"
        );


      }


    };



  // ==========================================================
  // Firestore 即時同步
  // ==========================================================


  const q =

    query(

      recordsRef,

      orderBy(

        "createdAt",

        "desc"

      )

    );



  onSnapshot(

    q,

    snapshot => {


      records =

        snapshot.docs.map(

          document => ({

            id:
              document.id,

            ...document.data()

          })

        );



      renderRecords();


    },


    error => {


      console.error(
        error
      );


      showStatus(

        "⚠️ Firebase 連線錯誤：" +

        error.message

      );


    }

  );



  // ==========================================================
  // 顯示紀錄
  // ==========================================================


  window.renderRecords =
    function() {


      const tbody =

        document
          .getElementById(
            "recordList"
          );



      const filter =

        document
          .getElementById(
            "filterType"
          )
          .value;



      tbody.innerHTML =
        "";



      const filtered =

        filter === "全部"

          ?

          records

          :

          records.filter(

            record =>

              record.type === filter

          );



      if (

        filtered.length === 0

      ) {


        tbody.innerHTML = `

          <tr>

            <td colspan="7">

              目前沒有紀錄

            </td>

          </tr>

        `;


        return;

      }



      filtered.forEach(
        record => {


          const tr =
            document.createElement(
              "tr"
            );



          let remaining = null;



          if (
            record.endAt
          ) {


            remaining =

              Math.max(

                0,

                Math.floor(

                  (

                    record.endAt.toMillis() -

                    Date.now()

                  )

                  / 1000

                )

              );


          }



          const countdownText =

            remaining === null

              ?

              "-"

              :

              formatTime(
                remaining
              );



          const expired =

            remaining !== null &&

            remaining <= 0;



          tr.innerHTML = `


            <td>

              <div class="coordinate">

                ${escapeHtml(
                  record.coordinate || ""
                )}

              </div>


              <button

                class="btn-copy"

                style="margin-top:6px;"

                onclick="copyCoordinate(
                  '${escapeAttribute(
                    record.coordinate || ""
                  )}'
                )"

              >

                📋 複製座標

              </button>

            </td>



            <td>

              ${escapeHtml(
                record.location || "-"
              )}

            </td>



            <td>

              ${escapeHtml(
                record.type || ""
              )}

            </td>



            <td class="people">

              ${record.people || ""}

            </td>



            <td>

              ${getLocalTime(
                record.coordinate
              )}

            </td>



            <td>

              <span

                class="countdown ${
                  expired
                    ? "expired"
                    : ""
                }"

                data-end="${
                  record.endAt
                    ? record.endAt.toMillis()
                    : ""
                }"

              >

                ${countdownText}

              </span>

            </td>



            <td>

              <div class="actions">


                <button

                  class="btn-edit"

                  onclick="editRecord(
                    '${record.id}'
                  )"

                >

                  ✏️ 修改

                </button>



                <button

                  class="btn-delete"

                  onclick="deleteRecord(
                    '${record.id}'
                  )"

                >

                  🗑️ 刪除

                </button>


              </div>

            </td>


          `;



          tbody.appendChild(
            tr
          );


        }

      );


    };



  // ==========================================================
  // 每秒更新
  // ==========================================================


  setInterval(

    () => {


      // 更新倒數


      document
        .querySelectorAll(
          ".countdown"
        )
        .forEach(

          element => {


            const end =
              Number(
                element.dataset.end
              );



            // 沒有倒數


            if (
              !end
            ) {

              return;

            }



            const remaining =

              Math.max(

                0,

                Math.floor(

                  (

                    end -

                    Date.now()

                  )

                  / 1000

                )

              );



            element.textContent =

              formatTime(
                remaining
              );



            if (

              remaining <= 0

            ) {

              element.classList.add(
                "expired"
              );


            }


            else {


              element.classList.remove(
                "expired"
              );


            }


          }

        );



      // 更新表單當地時間


      const coordinate =

        document
          .getElementById("coordinate")
          .value
          .trim();



      if (
        coordinate
      ) {


        document
          .getElementById("localTime")
          .value =

          getLocalTime(
            coordinate
          );


      }


      // 每秒重新渲染當地時間

      renderRecords();


    },

    1000

  );



  // ==========================================================
  // 狀態訊息
  // ==========================================================


  function showStatus(
    message
  ) {


    const status =

      document
        .getElementById(

        );



    status.textContent =

    setTimeout(

  // ==========================================================
  // 防止 HTML 注入
  // ==========================================================


  function escapeHtml(
    text
  ) {


    return String(text)

      .replace(
        /&/g,
        "&amp;"
      )

      .replace(
        /</g,
        "&lt;"
      )

      .replace(
        />/g,
        "&gt;"
      )

      .replace(
        /"/g,
        "&quot;"
      )

      .replace(
        /'/g,
        "&#039;"
      );


  }



  function escapeAttribute(
    text
  ) {


    return String(text)

      .replace(
        /\\/g,
        "\\\\"
      )

      .replace(
        /'/g,
        "\\'"
      );


  }
