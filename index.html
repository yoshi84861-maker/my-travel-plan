<script type="module">


/* =========================
   Firebase
========================= */


import {

  initializeApp

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";



import {

  initializeFirestore,

  persistentLocalCache,

  persistentMultipleTabManager,

  collection,

  addDoc,

  deleteDoc,

  doc,

  onSnapshot,

  query,

  orderBy,

  serverTimestamp,

  Timestamp

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



/* =========================
   Firebase 設定

   ↓↓↓

   改成你的 Firebase 資料

========================= */


const firebaseConfig = {


  apiKey:

    "你的_API_KEY",


  authDomain:

    "你的_PROJECT_ID.firebaseapp.com",


  projectId:

    "你的_PROJECT_ID",


  storageBucket:

    "你的_PROJECT_ID.appspot.com",


  messagingSenderId:

    "你的_MESSAGING_SENDER_ID",


  appId:

    "你的_APP_ID"


};



/* =========================
   Google Time Zone API Key

   ↓↓↓

   填入你的 Google API Key

========================= */


const GOOGLE_TIMEZONE_API_KEY =

  "你的_GOOGLE_TIMEZONE_API_KEY";



/* =========================
   Firebase 初始化

   persistentLocalCache：

   瀏覽器關閉後
   本機快取仍保留

   Firestore：

   雲端資料永久保留

========================= */


const app =

  initializeApp(
    firebaseConfig
  );



const db =

  initializeFirestore(

    app,

    {

      localCache:

        persistentLocalCache({

          tabManager:

            persistentMultipleTabManager()

        })

    }

  );



const recordsRef =

  collection(

    db,

    "mushroomRecords"

  );



let records = [];


/* =========================
   座標解析
========================= */


function parseCoordinate(

  text

) {


  const parts =

    text

      .split(",")

      .map(

        x => x.trim()

      );



  if (

    parts.length !== 2

  ) {

    return null;

  }



  const lat =

    Number(parts[0]);


  const lng =

    Number(parts[1]);



  if (

    Number.isNaN(lat)

    ||

    Number.isNaN(lng)

    ||

    lat < -90

    ||

    lat > 90

    ||

    lng < -180

    ||

    lng > 180

  ) {

    return null;

  }



  return {

    lat,

    lng

  };


}



/* =========================
   Google Time Zone API

   經緯度
   ↓
   真正的時區

========================= */


async function getTimezone(

  coordinate

) {


  const point =

    parseCoordinate(
      coordinate
    );



  if (

    !point

  ) {

    return null;

  }



  const timestamp =

    Math.floor(

      Date.now() / 1000

    );



  const url =

    "https://maps.googleapis.com/maps/api/timezone/json"

    +

    "?location="

    +

    encodeURIComponent(

      point.lat +

      "," +

      point.lng

    )

    +

    "&timestamp="

    +

    timestamp

    +

    "&key="

    +

    GOOGLE_TIMEZONE_API_KEY;



  try {


    const response =

      await fetch(
        url
      );



    const data =

      await response.json();



    if (

      data.status === "OK"

    ) {


      return {

        timeZoneId:

          data.timeZoneId,

        rawOffset:

          data.rawOffset,

        dstOffset:

          data.dstOffset

      };


    }



    console.error(

      "Time Zone API Error:",

      data

    );



    return null;


  }


  catch (

    error

  ) {


    console.error(

      error

    );


    return null;


  }


}



/* =========================
   顯示當地時間

   使用：

   Google API 回傳的

   UTC Offset

   + DST Offset

========================= */


function formatLocalTime(

  rawOffset,

  dstOffset

) {


  const now =

    Date.now();



  const localTime =

    new Date(

      now

      +

      (

        rawOffset +

        dstOffset

      )

      *

      1000

    );



  const year =

    localTime

      .getUTCFullYear();



  const month =

    String(

      localTime

        .getUTCMonth()

        + 1

    )

    .padStart(

      2,

      "0"

    );



  const day =

    String(

      localTime

        .getUTCDate()

    )

    .padStart(

      2,

      "0"

    );



  const hour =

    String(

      localTime

        .getUTCHours()

    )

    .padStart(

      2,

      "0"

    );



  const minute =

    String(

      localTime

        .getUTCMinutes()

    )

    .padStart(

      2,

      "0"

    );



  const second =

    String(

      localTime

        .getUTCSeconds()

    )

    .padStart(

      2,

      "0"

    );



  return (

    year

    +

    "/"

    +

    month

    +

    "/"

    +

    day

    +

    " "

    +

    hour

    +

    ":"

    +

    minute

    +

    ":"

    +

    second

  );


}



/* =========================
   座標輸入

   自動取得時區

========================= */


document

  .getElementById(

    "coordinate"

  )

  .addEventListener(

    "change",

    async function() {


      const coordinate =

        this.value.trim();



      const localTimeInput =

        document.getElementById(

          "localTime"

        );



      if (

        !parseCoordinate(
          coordinate
        )

      ) {


        localTimeInput.value =

          "";


        return;


      }



      localTimeInput.value =

        "取得時區中...";



      const timezone =

        await getTimezone(
          coordinate
        );



      if (

        !timezone

      ) {


        localTimeInput.value =

          "無法取得";


        return;


      }



      localTimeInput.value =

        formatLocalTime(

          timezone.rawOffset,

          timezone.dstOffset

        );


    }

  );



/* =========================
   mm:ss → 秒

========================= */


function parseDuration(

  text

) {


  text =

    text.trim();



  /* 非必填 */


  if (

    !text

  ) {

    return null;

  }



  const parts =

    text.split(
      ":"
    );



  if (

    parts.length !== 2

  ) {

    return "INVALID";

  }



  const minutes =

    Number(
      parts[0]
    );


  const seconds =

    Number(
      parts[1]
    );



  if (

    Number.isNaN(
      minutes
    )

    ||

    Number.isNaN(
      seconds
    )

    ||

    minutes < 0

    ||

    seconds < 0

    ||

    seconds >= 60

  ) {

    return "INVALID";

  }



  return (

    minutes

    *

    60

    +

    seconds

  );


}



/* =========================
   秒 → mm:ss
========================= */


function formatDuration(

  totalSeconds

) {


  totalSeconds =

    Math.max(

      0,

      Math.floor(

        totalSeconds

      )

    );



  const minutes =

    Math.floor(

      totalSeconds

      /

      60

    );


  const seconds =

    totalSeconds

    %

    60;



  return (

    String(
      minutes
    )

    .padStart(

      2,

      "0"

    )

    +

    ":"

    +

    String(
      seconds
    )

    .padStart(

      2,

      "0"

    )

  );


}



/* =========================
   新增紀錄
========================= */


window.saveRecord =

  async function() {


    const coordinate =

      document

        .getElementById(

          "coordinate"

        )

        .value

        .trim();



    const location =

      document

        .getElementById(

          "location"

        )

        .value

        .trim();



    const type =

      document

        .getElementById(

          "type"

        )

        .value;



    const people =

      Number(

        document

          .getElementById(

            "people"

          )

          .value

      );



    const remainingTime =

      document

        .getElementById(

          "remainingTime"

        )

        .value

        .trim();



    /* 檢查座標 */


    if (

      !parseCoordinate(
        coordinate
      )

    ) {


      alert(

        "座標格式錯誤！\n\n"

        +

        "例如：\n"

        +

        "42.6957080, 23.3320190"

      );


      return;


    }



    /* 檢查剩餘時間 */


    const duration =

      parseDuration(
        remainingTime
      );



    if (

      duration === "INVALID"

    ) {


      alert(

        "剩餘時間格式錯誤！\n\n"

        +

        "請輸入例如：30:00\n\n"

        +

        "也可以留空。"

      );


      return;


    }



    let endAt =

      null;



    /* 有輸入才倒數 */


    if (

      duration !== null

    ) {


      endAt =

        Timestamp.fromMillis(

          Date.now()

          +

          duration

          *

          1000

        );


    }



    /* 取得時區 */


    showStatus(

      "🌍 正在取得座標時區..."

    );



    const timezone =

      await getTimezone(
        coordinate
      );



    if (

      !timezone

    ) {


      alert(

        "無法取得此座標的時區。\n\n"

        +

        "請確認 Google Time Zone API Key 是否設定正確。"

      );


      return;


    }



    /* 寫入 Firestore */


    try {


      await addDoc(

        recordsRef,

        {

          coordinate,

          location,

          type,

          people,

          endAt,


          /* 儲存真正時區 */


          timeZoneId:

            timezone.timeZoneId,


          rawOffset:

            timezone.rawOffset,


          dstOffset:

            timezone.dstOffset,


          createdAt:

            serverTimestamp()

        }

      );



      showStatus(

        "✅ 已儲存到雲端"

      );



      resetForm();


    }


    catch (

      error

    ) {


      console.error(
        error
      );



      alert(

        "儲存失敗：\n\n"

        +

        error.message

      );


    }


  };



/* =========================
   刪除
========================= */


window.deleteRecord =

  async function(

    id

  ) {


    if (

      !confirm(

        "確定要刪除這筆紀錄嗎？"

      )

    ) {

      return;

    }



    try {


      await deleteDoc(

        doc(

          db,

          "mushroomRecords",

          id

        )

      );


    }


    catch (

      error

    ) {


      alert(

        "刪除失敗：\n"

        +

        error.message

      );


    }


  };



/* =========================
   複製座標
========================= */


window.copyCoordinate =

  async function(

    coordinate

  ) {


    try {


      await navigator

        .clipboard

        .writeText(

          coordinate

        );



      showStatus(

        "📋 已複製座標"

      );


    }


    catch (

      error

    ) {


      const textarea =

        document.createElement(

          "textarea"

        );



      textarea.value =

        coordinate;



      document.body.appendChild(

        textarea

      );



      textarea.select();



      document.execCommand(

        "copy"

      );



      textarea.remove();



      showStatus(

        "📋 已複製座標"

      );


    }


  };



/* =========================
   清空表單
========================= */


function resetForm() {


  document

    .getElementById(

      "coordinate"

    )

    .value =

    "";



  document

    .getElementById(

      "location"

    )

    .value =

    "";



  document

    .getElementById(

      "type"

    )

    .value =

    "毒";



  document

    .getElementById(

      "people"

    )

    .value =

    "5";



  document

    .getElementById(

      "localTime"

    )

    .value =

    "";



  document

    .getElementById(

      "remainingTime"

    )

    .value =

    "";


}



/* =========================
   Firestore 即時同步

   資料永久讀取

========================= */


const q =

  query(

    recordsRef,

    orderBy(

      "createdAt",

      "desc"

    )

  );



onSnapshot(

  q,


  snapshot => {


    records =

      snapshot.docs.map(

        document => ({

          id:

            document.id,


          ...document.data()

        })

      );



    renderRecords();


  },


  error => {


    console.error(
      error
    );



    showStatus(

      "⚠️ Firebase 錯誤："

      +

      error.message

    );


  }

);



/* =========================
   顯示紀錄
========================= */


window.renderRecords =

  function() {


    const tbody =

      document.getElementById(

        "recordList"

      );



    const filter =

      document

        .getElementById(

          "filterType"

        )

        .value;



    tbody.innerHTML =

      "";



    const filtered =

      filter === "全部"

        ?

        records

        :

        records.filter(

          record =>

            record.type === filter

        );



    if (

      filtered.length === 0

    ) {


      tbody.innerHTML = `

        <tr>

          <td colspan="7">

            目前沒有紀錄

          </td>

        </tr>

      `;



      return;


    }



    filtered.forEach(

      record => {


        const tr =

          document.createElement(

            "tr"

          );



        /* 剩餘時間 */


        let remaining =

          null;



        if (

          record.endAt

        ) {


          remaining =

            Math.max(

              0,

              Math.floor(

                (

                  record.endAt.toMillis()

                  -

                  Date.now()

                )

                /

                1000

              )

            );


        }



        const countdownText =

          remaining === null

            ?

            "-"

            :

            formatDuration(

              remaining

            );



        const expired =

          remaining !== null

          &&

          remaining <= 0;



        /* 當地時間 */


        let localTime =

          "-";



        if (

          record.rawOffset !== undefined

        ) {


          localTime =

            formatLocalTime(

              record.rawOffset,

              record.dstOffset

            );


        }



        tr.innerHTML = `


          <td>


            <div class="coordinate">

              ${escapeHtml(

                record.coordinate || ""

              )}

            </div>


            <button

              class="btn-copy"

              style="margin-top:8px;"

              onclick="copyCoordinate(
                '${escapeAttribute(
                  record.coordinate || ""
                )}'
              )"

            >

              📋 複製座標

            </button>


          </td>



          <td>

            ${escapeHtml(

              record.location || "-"

            )}

          </td>



          <td>

            ${escapeHtml(

              record.type || ""

            )}

          </td>



          <td class="people">

            ${record.people || ""}

          </td>



          <td

            class="local-time"

            data-raw="${

              record.rawOffset ?? ""

            }"

            data-dst="${

              record.dstOffset ?? ""

            }"

          >

            ${localTime}

          </td>



          <td>


            <span

              class="countdown ${
                expired
                  ? "expired"
                  : ""
              }"


              data-end="${

                record.endAt

                  ?

                  record.endAt.toMillis()

                  :

                  ""

              }"

            >


              ${countdownText}


            </span>


          </td>



          <td>


            <button

              class="btn-delete"

              onclick="deleteRecord(
                '${record.id}'
              )"

            >

              🗑️ 刪除

            </button>


          </td>


        `;



        tbody.appendChild(

          tr

        );


      }

    );


  };



/* =========================
   每秒更新

   倒數

   +

   當地時間

========================= */


setInterval(

  () => {


    /* 倒數 */


    document

      .querySelectorAll(

        ".countdown"

      )

      .forEach(

        element => {


          const end =

            Number(

              element.dataset.end

            );



          if (

            !end

          ) {

            return;

          }



          const remaining =

            Math.max(

              0,

              Math.floor(

                (

                  end

                  -

                  Date.now()

                )

                /

                1000

              )

            );



          element.textContent =

            formatDuration(

              remaining

            );



          if (

            remaining <= 0

          ) {


            element.classList.add(

              "expired"

            );


          }


          else {


            element.classList.remove(

              "expired"

            );


          }

      );



    /* 表格當地時間 */


    document

      .querySelectorAll(

        ".local-time"

      )

      .forEach(

        element => {


          const raw =

            Number(

              element.dataset.raw

            );


          const dst =

            Number(

              element.dataset.dst

            );



          if (

            !Number.isNaN(raw)

          ) {


            element.textContent =

              formatLocalTime(

                raw,

      );

    const coordinate =

      document

        .getElementById(

        )

        .value

    if (

      &&

      parseCoordinate(

        coordinate

      // 已取得 API 結果後才會處理
